[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warp-charger"
version = "0.1.0"
description = "Async client for the local WebSocket/HTTP API of Tinkerforge WARP chargers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Florian Schlittenbauer" }]
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.12"]
keywords = ["tinkerforge", "warp", "wallbox", "ev-charger", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/schliflo/warp-charger"
Issues = "https://github.com/schliflo/warp-charger/issues"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["warp_charger"]

[tool.hatch.build.targets.sdist]
include = ["warp_charger", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["warp_charger", "conftest"]
